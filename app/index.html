<!DOCTYPE html>
<html lang="en">
<head>
<script>try{var th=localStorage.getItem("turnotto.theme");if(th==="dark"||th==="light")document.documentElement.dataset.theme=th}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turnotto</title>
<meta name="description" content="Kawaii shift planner with Otto the owl. Works offline, in 39 languages.">
<meta name="theme-color" content="#FFB3CC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Turnotto">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="icons.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --pink:#FF8FB1;--pink2:#FFD1E0;--pink3:#FFF0F5;
  --lav:#B8A6FF;--lav2:#ECE6FF;--lavd:#5E49B8;
  --mint:#8FE3C8;--mint2:#DDF8EE;--peach:#FFC89E;--sky:#9ED4FF;--lemon:#FFE89E;
  --ink:#40354F;--ink2:#665A7D;--line:#E6DAF2;
  --bg1:#FFF4F8;--bg2:#F0EEFF;--bg-mid:#FDF1FF;
  --surface:#fff;--surface-2:#F7F3FC;--surface-glass:rgba(255,255,255,.88);--card:rgba(255,255,255,.9);
  --header-bg:rgba(255,244,248,.82);--hero:linear-gradient(135deg,rgba(255,209,224,.75),rgba(236,230,255,.85));--warm:linear-gradient(135deg,#FFF3D1,#FFE3EC);
  --pri:#C9245E;--pri-2:#E0457A;--lav-btn:#5E49B8;--lav-btn2:#7A64D6;--mint-btn:#13704F;--mint-btn2:#1A8A63;
  --ok:#16704F;--ko:#B81F52;--warn:#8C5200;--ok-bg:#E3F7EE;--ko-bg:#FFE4EB;--ko-bg2:#FFCCD8;
  --leave-a:#FFF3D6;--leave-b:#FFF9EA;--leave-ink:#7A5200;--chip-pink-ink:#A61E4D;--chip-mint-ink:#11643F;--we-ink:#A61E4D;
  --focus:#5E49B8;--scrim:rgba(64,53,79,.4);
  --r:22px;--sh:0 10px 30px -12px rgba(94,73,184,.35);--sh2:0 4px 12px -4px rgba(94,73,184,.25);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
:root[data-theme=dark]{--pink:#FF9DBD;--pink2:#5A2D45;--pink3:#3E2638;
  --lav:#9C87F0;--lav2:#3B3160;--lavd:#CDBEFF;
  --mint:#5FC9A6;--mint2:#1F3B33;
  --ink:#F4EEFF;--ink2:#CBC0E2;--line:#463B63;
  --bg1:#1B1626;--bg2:#221B33;--bg-mid:#201A2F;
  --surface:#2A2340;--surface-2:#342B4F;--surface-glass:rgba(42,35,64,.92);--card:rgba(42,35,64,.94);
  --header-bg:rgba(27,22,38,.85);--hero:linear-gradient(135deg,#3B2649,#2B2552);--warm:linear-gradient(135deg,#3A3020,#3D2635);
  --ok:#7DE6BF;--ko:#FF9DBD;--warn:#FFC977;--ok-bg:#1D3A30;--ko-bg:#4A2233;--ko-bg2:#5E2A40;
  --leave-a:#3A321E;--leave-b:#30291A;--leave-ink:#FFD889;--chip-pink-ink:#FFC0D4;--chip-mint-ink:#97EBCB;--we-ink:#FFC0D4;
  --focus:#CDBEFF;--scrim:rgba(0,0,0,.55);
  --sh:0 10px 30px -12px rgba(0,0,0,.6);--sh2:0 4px 12px -4px rgba(0,0,0,.5);color-scheme:dark;}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--pink:#FF9DBD;--pink2:#5A2D45;--pink3:#3E2638;
  --lav:#9C87F0;--lav2:#3B3160;--lavd:#CDBEFF;
  --mint:#5FC9A6;--mint2:#1F3B33;
  --ink:#F4EEFF;--ink2:#CBC0E2;--line:#463B63;
  --bg1:#1B1626;--bg2:#221B33;--bg-mid:#201A2F;
  --surface:#2A2340;--surface-2:#342B4F;--surface-glass:rgba(42,35,64,.92);--card:rgba(42,35,64,.94);
  --header-bg:rgba(27,22,38,.85);--hero:linear-gradient(135deg,#3B2649,#2B2552);--warm:linear-gradient(135deg,#3A3020,#3D2635);
  --ok:#7DE6BF;--ko:#FF9DBD;--warn:#FFC977;--ok-bg:#1D3A30;--ko-bg:#4A2233;--ko-bg2:#5E2A40;
  --leave-a:#3A321E;--leave-b:#30291A;--leave-ink:#FFD889;--chip-pink-ink:#FFC0D4;--chip-mint-ink:#97EBCB;--we-ink:#FFC0D4;
  --focus:#CDBEFF;--scrim:rgba(0,0,0,.55);
  --sh:0 10px 30px -12px rgba(0,0,0,.6);--sh2:0 4px 12px -4px rgba(0,0,0,.5);color-scheme:dark;}}
html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden}
@supports(overflow:clip){html,body{overflow-x:clip}}
body{font-family:Nunito,ui-rounded,system-ui,-apple-system,'Segoe UI','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic UI','Malgun Gothic','Apple SD Gothic Neo','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1) 0%,var(--bg-mid) 45%,var(--bg2) 100%);background-attachment:fixed;font-size:15px;line-height:1.4;overflow-x:hidden}
h1,h2,h3,h4,.baloo{font-family:'Baloo 2',Nunito,ui-rounded,system-ui,'Hiragino Maru Gothic ProN','Malgun Gothic','PingFang SC','Microsoft YaHei',sans-serif;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
small,.muted{color:var(--ink2)}
.bgdeco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bgdeco i{position:absolute;font-style:normal;opacity:.45;animation:float 14s ease-in-out infinite;user-select:none}
@keyframes float{0%,100%{transform:translateY(0) rotate(0) scale(1)}50%{transform:translateY(-40px) rotate(25deg) scale(1.15)}}

/* layout */
.shell{position:relative;z-index:1;min-height:100vh}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 18px 10px;background:var(--header-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:'Baloo 2';font-weight:800;font-size:22px;color:var(--lavd);cursor:pointer}
.brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--pink),var(--lav));display:grid;place-items:center;box-shadow:var(--sh2);overflow:hidden}
.brand span b{color:var(--pri)}
.top .spacer{flex:1;min-width:4px}
header.top{max-width:100vw}
.top>*{flex-shrink:0}
.top .brand{flex-shrink:1;min-width:0}
.top .brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:600px){.top{gap:6px;padding-left:12px;padding-right:12px}.top .hm{display:none}#installBtn .lbl{display:none}#installBtn{padding:6px 9px}.brand{font-size:19px}}
@media(max-width:340px){.brand span{display:none}}
nav.side{display:none}
main{padding:18px 18px calc(96px + var(--safe-b));max-width:1400px;margin:0 auto}
nav.bottom{position:fixed;left:10px;right:10px;bottom:calc(10px + var(--safe-b));z-index:30;display:flex;justify-content:space-around;background:var(--surface-glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:26px;box-shadow:var(--sh);padding:6px 4px}
.navbtn{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:18px;cursor:pointer;font-size:10.5px;font-weight:800;color:var(--ink2);transition:.25s}
.navbtn .ic{font-size:21px;transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.navbtn.on{color:var(--lavd);background:var(--lav2)}
.navbtn.on .ic{transform:translateY(-3px) scale(1.18)}
@media(min-width:960px){
  nav.bottom{display:none}
  nav.side{display:flex;flex-direction:column;gap:6px;position:fixed;top:78px;left:16px;width:210px;padding:14px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
  nav.side .navbtn{flex-direction:row;justify-content:flex-start;gap:10px;font-size:15px;padding:11px 14px}
  nav.side .navbtn .ic{font-size:20px}
  nav.side .navbtn.on .ic{transform:scale(1.2) rotate(-8deg)}
  main{margin-left:240px;padding-bottom:40px}
  .sideowl{display:flex!important;justify-content:center;margin-top:8px}
}
.sideowl{display:none}

/* components */
.vhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.vhead h2{font-size:28px;font-weight:800;color:var(--lavd)}
.vhead .grow{flex:1}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.row.end{justify-content:flex-end}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;border:1px solid var(--line);position:relative}
.grid{display:grid;gap:14px}
.cards{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
.view-enter{animation:viewin .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes viewin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.btn{border:0;border-radius:16px;padding:10px 16px;font-weight:800;cursor:pointer;background:var(--surface);box-shadow:var(--sh2);transition:transform .2s cubic-bezier(.3,1.8,.5,1),box-shadow .2s,background .2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn:active{transform:scale(.92)}
.btn.pri{background:linear-gradient(135deg,var(--pri-2),var(--pri));color:#fff}
.btn.lav{background:linear-gradient(135deg,var(--lav-btn2),var(--lav-btn));color:#fff}
.btn.mint{background:linear-gradient(135deg,var(--mint-btn2),var(--mint-btn));color:#fff}
.btn.ghost{background:var(--surface-glass);box-shadow:none;border:1.5px solid var(--line)}
.btn.danger{color:var(--ko)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:12px}
.btn.big{padding:14px 22px;font-size:17px;border-radius:20px}
.btn[disabled]{opacity:.5;pointer-events:none}
.iconbtn{border:0;background:var(--surface-glass);width:36px;height:36px;border-radius:12px;cursor:pointer;font-size:17px;display:grid;place-items:center;transition:.2s}
.iconbtn:hover{background:var(--surface);transform:scale(1.1)}
.avatar{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;font-weight:900;color:#2E2445;flex:none;font-size:16px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.avatar.xs{width:26px;height:26px;border-radius:9px;font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;background:var(--lav2);color:var(--lavd);white-space:nowrap}
.chip.pink{background:var(--pink3);color:var(--chip-pink-ink)}
.chip.mint{background:var(--mint2);color:var(--chip-mint-ink)}
.chip.gray{background:var(--surface-2);color:var(--ink2)}
.hours{text-align:center;background:var(--pink3);border-radius:14px;padding:4px 10px;line-height:1.05}
.hours b{font-size:20px;color:var(--pri);font-family:'Baloo 2'}
.hours small{display:block;font-size:10px;font-weight:800}
.stat{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.stat .big{font-family:'Baloo 2';font-size:32px;font-weight:800;color:var(--lavd);line-height:1}
.stat .lbl{font-size:13px;font-weight:800;color:var(--ink2)}
.stat .emo{position:absolute;right:12px;top:10px;font-size:30px;opacity:.9;animation:wiggle 3s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg) scale(1.1)}}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--sky));transition:width 1s cubic-bezier(.2,1,.3,1)}
.empty{text-align:center;padding:30px 16px}
.empty h3{color:var(--lavd);font-size:22px;margin:8px 0 4px}

/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-weight:800;font-size:13px;color:var(--ink2)}
.inp,select.inp,textarea.inp{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;font-weight:700;color:var(--ink);outline:none;transition:border .2s,box-shadow .2s}
.inp:focus{border-color:var(--lav);box-shadow:0 0 0 4px var(--lav2)}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;font-weight:800;cursor:pointer;transition:.2s;min-width:46px}
.daypick button.on{background:var(--ko);border-color:var(--ko);color:#fff;transform:scale(1.05)}
.daypick.good button.on{background:var(--lav);border-color:var(--lav)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:10px;border:3px solid #fff;box-shadow:var(--sh2);cursor:pointer;transition:.2s}
.swatches button.on{transform:scale(1.2);box-shadow:0 0 0 3px var(--lavd)}
.slotrow{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.section-t{font-family:'Baloo 2';font-weight:800;font-size:16px;color:var(--lavd);margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:800;font-size:14px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch input:focus-visible+i{outline:3px solid var(--focus);outline-offset:2px}
.switch i{width:44px;height:26px;border-radius:99px;background:#E6DDF1;position:relative;transition:.25s}
.switch i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:var(--sh2);transition:.3s cubic-bezier(.3,1.6,.5,1)}
.switch input:checked+i{background:var(--mint)}
.switch input:checked+i:after{left:21px}

/* modal */
.modal-bg{position:fixed;inset:0;height:100vh;height:100dvh;z-index:100;background:var(--scrim);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);width:100%;max-width:min(640px,100vw);max-height:92vh;max-height:92dvh;overscroll-behavior:contain;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + var(--safe-b));box-shadow:var(--sh);animation:up .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes up{from{transform:translateY(100%)}}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:28px;animation:zoom .4s cubic-bezier(.3,1.5,.5,1)}}
@keyframes zoom{from{transform:scale(.85);opacity:0}}
.modal .mtitle{font-size:22px;color:var(--lavd);display:flex;align-items:center;gap:8px;margin:0 0 14px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.modal-bg.closing{animation:fade .2s reverse forwards}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translateX(-50%);z-index:200;background:var(--surface);border-radius:20px;padding:8px 16px 8px 8px;box-shadow:var(--sh);display:flex;align-items:center;gap:8px;font-weight:800;animation:toast .5s cubic-bezier(.3,1.6,.5,1);max-width:92vw}
@keyframes toast{from{transform:translate(-50%,40px) scale(.8);opacity:0}}
@media(min-width:960px){.toast{bottom:30px}}

/* owl */
.owl{overflow:visible;display:block}
.owl .ob{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-6px) rotate(-2deg)}75%{transform:translateY(-3px) rotate(2deg)}}
.owl .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
.owl .wing{transform-box:fill-box;transform-origin:50% 8%}
.owl.jump .ob{animation:jump .6s cubic-bezier(.3,1.6,.5,1) 3}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-34px) scale(1.04)}}
.owl.jump .wl{animation:flapl .15s infinite alternate}
.owl.jump .wr{animation:flapr .15s infinite alternate}
@keyframes flapl{to{transform:rotate(40deg)}}
@keyframes flapr{to{transform:rotate(-40deg)}}
.owl.think .pupils{animation:look 1.6s ease-in-out infinite}
@keyframes look{0%,100%{transform:translate(-12px,-12px)}50%{transform:translate(12px,-12px)}}
.owl.think .ob{animation:sway 1.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.owl .cheek{animation:blush 4s ease-in-out infinite}
@keyframes blush{50%{opacity:.95}}
.bubble{background:var(--surface);border-radius:22px;padding:12px 16px;box-shadow:var(--sh2);font-weight:800;position:relative;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both .2s}
.bubble:before{content:"";position:absolute;left:-10px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:var(--surface);border-left:0}
.hero{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--hero);overflow:hidden}
.hero h1{font-size:30px;color:var(--lavd);font-weight:800}
.hero .owlwrap{cursor:pointer}

/* planner */
.tablewrap{overflow:auto;border-radius:18px;background:var(--surface);box-shadow:var(--sh);max-height:72vh;-webkit-overflow-scrolling:touch}
table.plan{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
table.plan th,table.plan td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:4px;text-align:center;vertical-align:middle}
table.plan thead th{position:sticky;top:0;z-index:3;background:var(--lav2);color:var(--lavd);font-weight:900;padding:8px 4px;min-width:84px}
table.plan thead th.we{background:var(--pink2);color:var(--we-ink)}
table.plan thead th small{display:block;font-weight:700;color:inherit}
table.plan th.sticky{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;min-width:150px;max-width:190px;box-shadow:4px 0 8px -6px rgba(111,91,194,.3)}
table.plan thead th.sticky{z-index:4;background:var(--lav2)}
table.plan tfoot th.sticky{background:var(--surface-2)}
table.plan td.wk,table.plan th.wk{border-left:3px solid var(--lav2)}
.pcell{display:flex;align-items:center;gap:6px;font-weight:800}
.pcell .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.cell{cursor:pointer;height:46px;transition:background .2s;position:relative}
td.cell:hover{background:var(--pink3)}
td.cell.we{background:var(--surface-2)}
td.cell.leave{background:repeating-linear-gradient(45deg,var(--leave-a),var(--leave-a) 6px,var(--leave-b) 6px,var(--leave-b) 12px)}
td.cell.off{background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 6px,var(--surface) 6px,var(--surface) 12px)}
td.cell.warn{box-shadow:inset 0 0 0 2px var(--warn)}
.sc{display:block;border-radius:10px;padding:3px 4px;font-weight:900;font-size:11.5px;margin:1px 0;color:#4A3F5C;animation:pop .4s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i,0)*6ms);white-space:nowrap}
.lv{font-size:11px;font-weight:900;color:var(--leave-ink)}
.warnb{position:absolute;top:1px;right:2px;font-size:11px}
td.tot{font-weight:900;white-space:nowrap;padding:4px 8px}
td.tot.ok{color:var(--ok)} td.tot.lo{color:var(--warn)} td.tot.hi{color:var(--ko)}
td.cov{font-weight:900;cursor:pointer;font-size:12px}
td.cov.ok{background:var(--ok-bg);color:var(--ok)}
td.cov.ko{background:var(--ko-bg);color:var(--ko);animation:pulse 1.8s infinite}
td.cov.na{color:var(--ink2)}
@keyframes pulse{50%{background:var(--ko-bg2)}}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.shiftbtns{display:grid;gap:8px}
.shiftbtn{display:flex;align-items:center;gap:10px;border:2.5px solid transparent;border-radius:16px;padding:10px 12px;cursor:pointer;font-weight:800;text-align:left;transition:.2s;background:var(--surface-2)}
.shiftbtn.on{border-color:var(--lavd);transform:scale(1.02)}
.shiftbtn .em{font-size:22px}
.shiftbtn .why{font-size:12px;color:inherit;font-weight:800}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calgrid .dh{text-align:center;font-weight:900;font-size:12px;color:var(--ink2)}
.calgrid .dc{min-height:58px;border-radius:12px;background:var(--surface);padding:4px;font-size:12px;font-weight:800;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;gap:2px;cursor:pointer;transition:.2s}
.calgrid .dc:hover{transform:scale(1.05);box-shadow:var(--sh2)}
.calgrid .dc.out{color:var(--ink2);background:var(--surface-2)}
.calgrid .dc.today{outline:2.5px solid var(--pink)}
.calgrid .dots{display:flex;flex-wrap:wrap;gap:2px}
.calgrid .dots span{width:14px;height:14px;border-radius:5px;font-size:8px;color:#2E2445;display:grid;place-items:center;font-weight:900}
.leaveitem{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--surface);margin-bottom:8px;box-shadow:0 1px 0 var(--line)}
.leaveitem .emo{font-size:24px}
.sett{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.rule{display:flex;flex-direction:column;gap:8px}
.rule .rt{display:flex;align-items:center;gap:8px;font-weight:900}
.rule .rt .e{font-size:24px}
.numbox{display:flex;align-items:center;gap:6px}
.numbox button{width:38px;height:38px;border-radius:12px;border:0;background:var(--lav2);color:var(--lavd);font-weight:900;font-size:20px;cursor:pointer;transition:.15s}
.numbox button:active{transform:scale(.85)}
.numbox input{text-align:center;font-size:18px;font-family:'Baloo 2'}
.shiftedit{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));align-items:end}
.needs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.needs label{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:900;color:var(--ink2)}
.needs input{text-align:center;padding:6px 2px}
.plancard .meta{font-size:13px;color:var(--ink2);font-weight:700}
.hide{display:none!important}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;background:var(--surface-2);border-radius:14px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:11px;font-weight:800;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--lavd);box-shadow:var(--sh2)}
.xlprev{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xlopt{border:3px solid transparent;border-radius:18px;padding:10px;cursor:pointer;transition:.2s;background:var(--surface-2)}
.xlopt.on{border-color:var(--lavd);transform:scale(1.03)}
.xlmini{border-radius:10px;overflow:hidden;font-size:9px;font-weight:800}
.xlmini div{display:grid;grid-template-columns:2fr repeat(4,1fr)}
.xlmini span{padding:4px 3px;border-right:1px solid rgba(0,0,0,.05);border-bottom:1px solid rgba(0,0,0,.05)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:300}
.overlay{position:fixed;inset:0;z-index:150;background:var(--header-bg);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:fade .3s}
.overlay h3{color:var(--lavd);font-size:24px}
.dotsload span{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pink);margin:0 3px;animation:dl 1s infinite}
.dotsload span:nth-child(2){animation-delay:.15s;background:var(--lav)}
.dotsload span:nth-child(3){animation-delay:.3s;background:var(--mint)}
@keyframes dl{50%{transform:translateY(-10px)}}
.warnlist{max-height:220px;overflow:auto;font-size:13px}
.warnlist div{padding:6px 8px;border-radius:10px;background:var(--leave-b);margin-bottom:4px}
.installcard,.warmcard{background:var(--warm)}
.infocard{background:var(--hero)}
@media(max-width:600px){.vhead h2{font-size:24px}.hero h1{font-size:24px}.slotrow{grid-template-columns:1fr 1fr 1fr auto}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
.langgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.langgrid button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;font-weight:800;cursor:pointer;text-align:left;transition:.2s;display:flex;justify-content:space-between;gap:6px}
.langgrid button small{font-weight:700;color:var(--ink2)}
.langgrid button:hover{transform:scale(1.04)}
.langgrid button.on{border-color:var(--lavd);background:var(--lav2);color:var(--lavd)}
.langbtn{border:0;background:var(--surface-glass);height:36px;border-radius:12px;cursor:pointer;font-weight:900;padding:0 10px;display:flex;align-items:center;gap:4px;color:var(--lavd);transition:.2s}
.langbtn:hover{background:var(--surface);transform:scale(1.06)}
.splash{position:fixed;inset:0;display:grid;place-items:center;z-index:500;background:linear-gradient(160deg,var(--bg1),var(--bg2))}
.wiz{max-width:560px!important;text-align:center}
.wiz .steps{display:flex;justify-content:center;gap:6px;margin:4px 0 14px}
.wiz .steps i{width:9px;height:9px;border-radius:99px;background:var(--line);transition:.3s}
.wiz .steps i.on{width:26px;background:var(--pink)}
.wiz .owl{width:auto;max-height:20dvh}
.wiz .wbody{min-height:min(240px,40dvh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;animation:viewin .4s}
.wiz .wbody .langgrid{width:100%;max-height:300px;overflow:auto;text-align:left}
.wiz ol,.wiz ul{text-align:left;font-weight:700;line-height:1.7;padding-left:22px;margin:0}
.wiz .acc{display:flex;gap:10px;align-items:flex-start;text-align:left;font-weight:800;background:var(--pink3);padding:12px;border-radius:16px;cursor:pointer}
.wiz .acc input{width:22px;height:22px;accent-color:var(--pink);flex:none}
.wiz .choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.wiz .choice button{border:3px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;font-weight:800;cursor:pointer;transition:.2s}
.wiz .choice button.on{border-color:var(--lavd);background:var(--lav2);transform:scale(1.03)}
.wiz .choice span{display:block;font-size:30px}
.info h3{color:var(--lavd);margin:18px 0 8px;font-size:20px}
.info p,.info li{line-height:1.55}
.info a{color:var(--lavd);font-weight:800}

/* ---- accessibilità ---- */
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:12px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:fixed;left:12px;top:-60px;z-index:600;background:var(--lav-btn);color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;text-decoration:none;transition:top .2s}
.skip:focus{top:calc(10px + var(--safe-t))}
.vhead h1{font-size:28px;font-weight:800;color:var(--lavd);outline:none}
@media(max-width:600px){.vhead h1{font-size:24px}}
button.owlwrap{border:0;background:none;padding:0;border-radius:28px}
button.shiftbtn,button.xlopt{width:100%;font:inherit;color:inherit;border:2.5px solid transparent}
button.xlopt{border-width:3px;text-align:left}
.i{font-size:1.2em}
.navbtn .ic .i{font-size:23px}
.iconbtn .i{font-size:20px}
.btn .i{font-size:1.25em}
.vhead .i{color:var(--pri)}
@media (prefers-reduced-motion:reduce){.bgdeco{display:none}}
@media (forced-colors:active){.btn,.iconbtn,.navbtn,.chip,.card{border:1px solid CanvasText}}
.calgrid .dots span::after{content:attr(data-i)}
.xlmini .xb{display:block;height:6px;border-radius:3px;background:currentColor;opacity:.75;margin:2px auto;width:70%}
.shiftbtn small{color:inherit}
</style>
</head>
<body>
<div class="splash" id="splash" aria-hidden="true"><img src="icons/icon-192.png" width="96" height="96" alt="" style="border-radius:28px;animation:pop .6s cubic-bezier(.3,1.6,.5,1)"></div>
<a class="skip" href="#home" data-act="skip" id="skipLink"></a>
<div class="bgdeco" id="bgdeco" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
<div class="shell">
  <header class="top">
    <a class="brand" href="#home" data-go="home"><span class="logo" id="minilogo" aria-hidden="true"></span><span>Turn<b>otto</b></span></a>
    <div class="spacer"></div>
    <button class="btn sm lav hide" id="installBtn"><i class="i i-install" aria-hidden="true"></i> <span class="lbl" data-t="btn.install"></span></button>
    <button class="langbtn" data-act="lang" id="langBtn"><i class="i i-globe" aria-hidden="true"></i> <span id="langCode">EN</span></button>
    <button class="iconbtn" data-act="info" id="tipInfo"><i class="i i-info" aria-hidden="true"></i></button>
    <button class="iconbtn hm" data-act="quick-save" id="tipSave"><i class="i i-save" aria-hidden="true"></i></button>
    <button class="iconbtn hm" data-act="quick-open" id="tipOpen"><i class="i i-folder" aria-hidden="true"></i></button>
  </header>
  <nav class="side" id="sidenav"></nav>
  <main id="view" tabindex="-1"></main>
  <nav class="bottom" id="botnav"></nav>
</div>
<input type="file" id="fileIn" accept=".json,application/json" class="hide">
<div id="modals"></div>
<script src="app.js"></script>
</body>
</html>
